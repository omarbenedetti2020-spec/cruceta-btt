
name: Compilar Cruceta BT

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip Cruceta_proyecto_listo_GitHub.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle -p Cruceta assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Cruceta-BT-APK
          path: Cruceta/app/build/outputs/apk/debug/app-debug.apk
          
